name: Update Submodules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }} # Substitua por ${{ secrets.PAT_TOKEN }} se os submódulos forem privados

      - name: Atualizar submódulos e realizar commit
        run: |
          git submodule update --remote --merge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "chore: update submodules to latest" && git push)
